appId: com.pedro.corretordeprovas

productName: Corretor de Provas

directories:
  output: dist-desktop

files:
  - electron/**/*
  - package.json

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Corretor de Provas